# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  # Every value here ends up on a label; a silently changed number reaches every user at once.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    # Release PRs from uppt only carry the version and the changelog.
    ignore_usernames:
      - github-actions[bot]
  path_filters:
    - "!pnpm-lock.yaml"
    - "!dist/**"
    - "!docs/**"
    # Generated by scripts/build.ts from the BLS source; review the script, not its output.
    - "!src/foods/**"
  path_instructions:
    - path: "**"
      instructions: |
        This package is an open, maintained food composition database for @thereforejs/nutrition,
        seeded from the BLS 4.0 (Max Rubner-Institut). It calculates nothing. A silently changed value is the worst
        possible bug; correctness beats style. SPEC.md is the source of truth for every rule; flag
        code that disagrees with it.
        - No em dashes or en dashes anywhere (code, comments, docs); a plain hyphen only.
        - Comments explain why, not what; few and short. Where a BLS rule is followed, its section of
          the BLS 4.0 documentation is the comment.
    - path: "scripts/**/*.ts"
      instructions: |
        - Every value has its source (SPEC 2). Flag any value that is changed, dropped, clamped or
          filled without its source in the food's `sources`, and any estimated value.
        - A BLS `-` is `null`, never `0`; a real `0` stays `0` (BLS documentation 4.3). `<LOD`, `<LOQ`
          and `TR` are neither zero nor missing. Flag any path that turns one into the other.
        - Numbers are written as the shortest decimal that reads back to the source double. Flag
          `toFixed`, `toPrecision` or any arithmetic on JavaScript numbers for values; sodium mg to g
          is a decimal shift, not a division.
        - Codes are never validated with `[A-Z]\d{6}`; 772 BLS codes look like `M5B1600`.
        - Output must be reproducible byte for byte: no Date, no randomness, no unordered iteration
          that changes the output.
    - path: "src/**/*.ts"
      instructions: |
        - Tree-shaking (SPEC 7): no module may hold a collection of all groups or all languages; a map
          like `{ de, en }` pulls everything into every bundle. Named exports only.
        - No `any`, no `as never`, no dead guards. Imports from vite-plus, never from vite or vitest.
    - path: "data/foods/*.json"
      instructions: |
        A contribution to the food data (CONTRIBUTING.md). Check every changed value against the
        source entry named in `sources` where the source is reachable, and flag a value without a
        source entry, a value that looks estimated or rounded by the contributor, or a whole (fat,
        carbohydrate) changed without its parts. A new food uses our id scheme (group letter, "_",
        six digits); flag any id that looks like an invented BLS code. A food that leaves
        `data/open-issues.json` must really be consistent now.
    - path: "src/sources.ts"
      instructions: |
        A new source must state an open license that allows redistribution (`LICENSES` in
        scripts/check.ts) and the pull request must link where the publisher states it. Flag a source
        whose license is unclear or not open, and a citation that differs from what the publisher asks.
    - path: "tests/**/*.ts"
      instructions: |
        Every rule needs a test that fails without it. Expected values come from the BLS source or are
        worked out by hand, never copied from the build's own output. Property tests use fast-check.
        Do not suggest weakening an assertion to make a test pass.

chat:
  auto_reply: true
